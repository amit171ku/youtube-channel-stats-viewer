<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Channel Stats Viewer</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet" />
  
  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Link to external CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="container glass-3d" role="main" aria-label="YouTube Channel Stats Viewer">
    <header>
      <h1>YouTube Channel Stats Viewer</h1>
      <button id="dark-mode-toggle" aria-label="Toggle Dark and Light mode">🌙</button>
    </header>
    <form id="channel-form" aria-label="YouTube channel input form" autocomplete="off">
      <input class="input-3d" type="text" id="channel-input" placeholder="Enter Channel ID or Username" required aria-required="true" />
      <button class="btn3D" type="submit" aria-label="Get channel stats">
        <span class="btnLayer">🔍 Get Stats</span>
      </button>
    </form>
    <div id="channel-info" class="card-3d" aria-live="polite" aria-atomic="true"></div>
    <canvas id="stats-chart" role="img" aria-label="Channel statistics chart"></canvas>
    <div id="top-videos" class="card-3d" aria-live="polite"></div>
    <section id="analytics">
      <div id="avg-views" class="analytics-box"></div>
      <div id="upload-frequency" class="analytics-box"></div>
      <canvas id="views-line-chart" aria-label="Video views over time line chart"></canvas>
      <canvas id="category-pie-chart" aria-label="Video category distribution pie chart"></canvas>
      <button id="export-csv-btn" type="button">Export Video Stats to CSV</button>
    </section>
    <footer>
      <p>Created by Amit Sharma | <a href="https://linkedin.com/in/amit-sharma174" target="_blank" rel="noopener">LinkedIn</a> | <a href="https://github.com/amit171ku" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </div>

  <script>
    VANTA.NET({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      color: 0x3e38d6,
      backgroundColor: 0x181c22,
      points: 12.0,
      maxDistance: 22.0,
      spacing: 18.0
    });

    // Dark mode toggle
    const toggleBtn = document.getElementById('dark-mode-toggle');
    const body = document.body;
    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('light-mode');
      if(body.classList.contains('light-mode')) {
        toggleBtn.textContent = '🌞';
      } else {
        toggleBtn.textContent = '🌙';
      }
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
